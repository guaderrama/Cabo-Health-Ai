<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Final - Gemini API</title>
    <style>
        body {
            font-family: system-ui;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #0f172a;
            color: #e2e8f0;
        }
        .test { background: #1e293b; padding: 20px; margin: 15px 0; border-radius: 10px; }
        .ok { border-left: 4px solid #10b981; }
        .fail { border-left: 4px solid #ef4444; }
        pre { background: #0f172a; padding: 15px; border-radius: 6px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Test Final de Gemini API</h1>
    <div id="result"></div>

    <script>
        const API_KEY = 'AIzaSyBsoNLTcxY-r33SFT4CXePqdEGjDVkwYN4';

        async function testGeminiAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>⏳ Probando Gemini API...</p>';

            try {
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{ text: 'Di solo "FUNCIONA"' }]
                            }]
                        })
                    }
                );

                const data = await response.json();

                if (response.ok) {
                    const respuesta = data.candidates[0].content.parts[0].text;
                    resultDiv.innerHTML = `
                        <div class="test ok">
                            <h2>✅ GEMINI API FUNCIONA CORRECTAMENTE</h2>
                            <p><strong>Status:</strong> ${response.status}</p>
                            <p><strong>API Key:</strong> ${API_KEY.substring(0, 20)}...</p>
                            <p><strong>Respuesta de Gemini:</strong></p>
                            <pre>${respuesta}</pre>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="test fail">
                            <h2>❌ ERROR EN GEMINI API</h2>
                            <p><strong>Status:</strong> ${response.status}</p>
                            <p><strong>Error:</strong></p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="test fail">
                        <h2>❌ ERROR FATAL</h2>
                        <pre>${error.message}</pre>
                    </div>
                `;
            }
        }

        testGeminiAPI();
    </script>
</body>
</html>
