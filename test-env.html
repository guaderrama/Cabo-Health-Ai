<!DOCTYPE html>
<html>
<head>
    <title>Test Environment Variables</title>
</head>
<body>
    <h1>Test de Variables de Entorno</h1>
    <div id="results"></div>

    <script type="module">
        const results = document.getElementById('results');

        // Verificar todas las variables de entorno de Vite
        const envVars = {
            'VITE_GEMINI_API_KEY': import.meta.env.VITE_GEMINI_API_KEY,
            'VITE_SUPABASE_URL': import.meta.env.VITE_SUPABASE_URL,
            'VITE_SUPABASE_ANON_KEY': import.meta.env.VITE_SUPABASE_ANON_KEY,
            'MODE': import.meta.env.MODE,
            'DEV': import.meta.env.DEV,
            'PROD': import.meta.env.PROD,
        };

        let html = '<h2>Variables de Entorno Detectadas:</h2><ul>';

        for (const [key, value] of Object.entries(envVars)) {
            const displayValue = value ?
                (key.includes('KEY') ? `${String(value).substring(0, 20)}...` : value) :
                '<span style="color: red">❌ UNDEFINED</span>';
            html += `<li><strong>${key}:</strong> ${displayValue}</li>`;
        }

        html += '</ul>';

        // Verificar si el API key está vacío
        const apiKey = import.meta.env.VITE_GEMINI_API_KEY;
        if (!apiKey || apiKey.trim() === '') {
            html += '<h2 style="color: red">⚠️ ERROR: VITE_GEMINI_API_KEY no está configurada o está vacía</h2>';
        } else {
            html += '<h2 style="color: green">✅ VITE_GEMINI_API_KEY está configurada correctamente</h2>';
        }

        results.innerHTML = html;
    </script>
</body>
</html>
